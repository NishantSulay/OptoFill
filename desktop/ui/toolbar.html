<!doctype html>
<!-- The address bar above the EMR: back, forward, reload, the EMR's address, and a button that shows or hides OptoFill. -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>OptoFill toolbar</title>
<style>
  :root { --bg: #f8fafc; --line: #e2e8f0; --text: #334155; --muted: #94a3b8; --blue: #2563eb; --field: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --line: #1e293b; --text: #e2e8f0; --muted: #64748b; --field: #1e293b; } }
  * { box-sizing: border-box; margin: 0; }
  body { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--bg); border-bottom: 1px solid var(--line);
         font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); overflow: hidden; }
  button { height: 30px; min-width: 30px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--line); }
  button:disabled { color: var(--muted); cursor: default; }
  form { flex: 1; display: flex; min-width: 0; }
  input { flex: 1; min-width: 0; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--field); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  #panel { font-weight: 600; color: var(--blue); }
  #panel[aria-pressed=false] { color: var(--text); }
</style>
<button id="back" title="Back" aria-label="Back" disabled>←</button>
<button id="forward" title="Forward" aria-label="Forward" disabled>→</button>
<button id="reload" title="Reload" aria-label="Reload">⟳</button>
<form id="go"><input id="url" type="text" placeholder="Your EMR’s web address, e.g. emr.yourpractice.com" spellcheck="false" autocomplete="off" aria-label="EMR address"></form>
<button id="practice" title="Open the practice EMR (made-up data, for trying OptoFill)">Practice EMR</button>
<button id="panel" aria-pressed="true" title="Show or hide OptoFill">OptoFill ▸</button>
<script src="toolbar.js"></script>
