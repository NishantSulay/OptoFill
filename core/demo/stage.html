<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OptoFill demo stage</title>
<!-- Recording stage for the website demo GIF: the mock EMR (synthetic data) next to the real popup. See record.js. -->
<style>
  html, body { margin: 0; height: 100%; background: #e2e8f0; font: 13px Arial, sans-serif; overflow: hidden; }
  .wrap { display: flex; gap: 16px; padding: 16px; height: calc(100% - 32px); box-sizing: content-box; }
  .win { background: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgba(15,23,42,.18); overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 30px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 6px; padding: 0 10px; color: #64748b; font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }
  .url { margin-left: 10px; background: #fff; border-radius: 6px; padding: 2px 10px; }
  #emr-win { flex: 1; }
  #popup-win { width: 380px; align-self: flex-start; }
  iframe { border: 0; flex: 1; width: 100%; }
  #popup { height: 740px; flex: none; }
  #cursor { position: fixed; left: -40px; top: -40px; width: 22px; height: 22px; pointer-events: none; z-index: 10;
            transition: left .55s ease, top .55s ease; }
  #cursor svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  #cursor.down::after { content: ''; position: absolute; left: -10px; top: -10px; width: 22px; height: 22px; border-radius: 50%;
            background: rgba(37,99,235,.35); animation: ping .35s ease-out; }
  @keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .tag { position: fixed; right: 26px; bottom: 18px; color: #64748b; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="win" id="emr-win">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">🔒 your-emr.example.com/exam</span></div>
    <iframe id="emr" src="../mock-emr/index.html"></iframe>
  </div>
  <div class="win" id="popup-win">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">OptoFill</span></div>
    <iframe id="popup"></iframe>
  </div>
</div>
<div id="cursor"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#0f172a" stroke="#fff" stroke-width="1.5"/></svg></div>
<div class="tag">Synthetic demo data</div>
</body>
</html>
