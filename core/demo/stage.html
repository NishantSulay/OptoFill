<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OptoFill demo stage</title>
<!-- Recording stage for the website video and store screenshots: a Chrome-style window with the mock EMR
     (synthetic data) and the real OptoFill UI in the side panel. Driven by lib.js. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: linear-gradient(135deg, #dbeafe 0%, #e0f2fe 45%, #ccfbf1 100%); }
  #cam { position: absolute; inset: 0; transform-origin: 0 0; transition: transform 1.1s cubic-bezier(.45,0,.2,1); will-change: transform; }
  .window { position: absolute; inset: 28px 32px 32px; background: #fff; border-radius: 12px; overflow: hidden;
            box-shadow: 0 24px 70px rgba(15,23,42,.22), 0 2px 6px rgba(15,23,42,.08); display: flex; flex-direction: column; }
  .tabs { height: 38px; background: #dfe3ea; display: flex; align-items: flex-end; padding: 0 12px; gap: 8px; }
  .lights { display: flex; gap: 7px; align-self: center; margin-right: 10px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .tab { background: #fff; border-radius: 9px 9px 0 0; padding: 9px 16px; color: #1f2937; font-size: 12.5px; min-width: 190px; }
  .toolbar { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #e5e7eb; color: #6b7280; }
  .omni { flex: 1; background: #f1f3f4; border-radius: 18px; padding: 7px 14px; font-size: 13px; color: #374151; }
  .ext { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg,#2563eb,#0d9488); color: #fff;
         display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 0 0 3px #bfdbfe; }
  .body { flex: 1; display: flex; min-height: 0; }
  #emr { flex: 1; border: 0; min-width: 0; }
  .side { width: 400px; border-left: 1px solid #e5e7eb; display: flex; flex-direction: column; background: #fff; }
  .side-head { height: 36px; display: flex; align-items: center; padding: 0 12px; gap: 8px; color: #374151; font-weight: 600; font-size: 12.5px; border-bottom: 1px solid #e5e7eb; }
  .side-head .x { margin-left: auto; color: #9ca3af; font-weight: 400; }
  #panel { flex: 1; border: 0; width: 100%; }
  #cursor { position: absolute; left: -60px; top: -60px; width: 26px; height: 26px; pointer-events: none; z-index: 20;
            transition: left .7s cubic-bezier(.45,0,.2,1), top .7s cubic-bezier(.45,0,.2,1); }
  #cursor svg { filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  #cursor.down::after { content: ''; position: absolute; left: -12px; top: -12px; width: 26px; height: 26px; border-radius: 50%;
            background: rgba(37,99,235,.4); animation: ping .45s ease-out; }
  @keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
  #caption { position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 16px); opacity: 0; z-index: 30;
             background: rgba(15,23,42,.88); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 19px; font-weight: 600;
             letter-spacing: .01em; box-shadow: 0 10px 30px rgba(15,23,42,.3); transition: opacity .45s, transform .45s; white-space: nowrap; }
  #caption.show { opacity: 1; transform: translate(-50%, 0); }
  #caption b { color: #5eead4; margin-right: 8px; }
  .tag { position: fixed; left: 40px; bottom: 9px; color: #475569; font-size: 11px; z-index: 30; }
</style>
</head>
<body>
<div id="cam">
  <div class="window">
    <div class="tabs"><span class="lights"><i></i><i></i><i></i></span><span class="tab">Exam — Test Patient</span></div>
    <div class="toolbar">← → ⟳ <span class="omni">🔒 your-emr.example.com/exam</span><span class="ext">👁</span></div>
    <div class="body">
      <iframe id="emr" src="../mock-emr/index.html"></iframe>
      <div class="side">
        <div class="side-head">👁 OptoFill <span class="x">✕</span></div>
        <iframe id="panel"></iframe>
      </div>
    </div>
  </div>
  <div id="cursor"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#0f172a" stroke="#fff" stroke-width="1.5"/></svg></div>
</div>
<div id="caption"></div>
<div class="tag">Demo EMR · synthetic data</div>
</body>
</html>
